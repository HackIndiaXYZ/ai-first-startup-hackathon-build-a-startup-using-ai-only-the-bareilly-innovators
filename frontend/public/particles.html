<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sivi Particle Sphere</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: transparent !important;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const PARTICLE_COUNT = 8000;
      let amplitude = 0;
      let currentPersonality = '';
      let particles;

      function updateColors(personality) {
        if (currentPersonality === personality || !particles) return;
        currentPersonality = personality;
        
        const colors = particles.geometry.attributes.color.array;
        let hueBase = 0.55; // Professional: Blue
        if (personality === 'gf') hueBase = 0.88; // GF: Pink/Magenta
        else if (personality === 'assistant') hueBase = 0.45; // Assistant: Teal
        else if (personality === 'developer') hueBase = 0.05; // Developer: Orange/Red
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const color = new THREE.Color();
          color.setHSL(hueBase + Math.random() * 0.10, 0.8, 0.6);
          colors[i * 3] = color.r;
          colors[i * 3 + 1] = color.g;
          colors[i * 3 + 2] = color.b;
        }
        particles.geometry.attributes.color.needsUpdate = true;
      }

      // Listen for amplitude and personality data from the React frontend
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'amplitude') {
          amplitude = event.data.value;
          if (event.data.personality) {
            updateColors(event.data.personality);
          }
        }
      });

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      function createHardCircleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.5, "rgba(255,255,255,0.9)");
        gradient.addColorStop(0.8, "rgba(255,255,255,0.1)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      const basePositions = new Float32Array(PARTICLE_COUNT * 3);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
        const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
        
        const x = 2.5 * Math.cos(theta) * Math.sin(phi);
        const y = 2.5 * Math.sin(theta) * Math.sin(phi);
        const z = 2.5 * Math.cos(phi);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        basePositions[i * 3] = x;
        basePositions[i * 3 + 1] = y;
        basePositions[i * 3 + 2] = z;

        const color = new THREE.Color();
        color.setHSL(0.55 + Math.random() * 0.10, 0.8, 0.6); // Default
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: createHardCircleTexture(),
      });

      particles = new THREE.Points(geometry, material);
      particles.position.y = 1.5; 
      scene.add(particles);

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        const posAttr = particles.geometry.attributes.position;

        // Rotate slowly
        particles.rotation.y += 0.002;
        particles.rotation.x += 0.001;

        // Base scale + extra scale based on amplitude (dramatic expansion)
        const s = 1.0 + amplitude * 0.8;
        particles.scale.lerp(new THREE.Vector3(s, s, s), 0.15);

        // Add intense bubbling/breathing to particles
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const ix = i * 3;
          // When amplitude is high, make particles vibrate aggressively
          const jitter = amplitude * (Math.random() - 0.5) * 1.2;
          
          posAttr.array[ix] = basePositions[ix] + Math.sin(time * 4 + i) * 0.03 * (1 + amplitude * 12) + jitter;
          posAttr.array[ix+1] = basePositions[ix+1] + Math.cos(time * 4 + i) * 0.03 * (1 + amplitude * 12) + jitter;
          posAttr.array[ix+2] = basePositions[ix+2] + Math.sin(time * 5 + i) * 0.03 * (1 + amplitude * 12) + jitter;
        }
        posAttr.needsUpdate = true;

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    </script>
  </body>
</html>
